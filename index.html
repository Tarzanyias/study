<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131314; --surface:#1b1c1d; --surface2:#282a2c; --border:#3c4043;
    --text:#e3e3e3; --muted:#a8abb0; --accent:#a8c7fa; --accent-ink:#062e6f;
    --sci:#81c995; --soc:#fdd663;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f0f4f9;--surface:#fff;--surface2:#e9eef6;--border:#dadce0;--text:#1f1f1f;--muted:#5f6368;--accent:#0b57d0;--accent-ink:#fff;--sci:#188038;--soc:#b06000}
  }
  [hidden]{display:none!important}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Google Sans Text","Google Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100dvh}
  button,a{font:inherit;color:inherit}
  .wrap{max-width:960px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px 56px}
  .top{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:8px}
  .top h1{font-family:"Google Sans",system-ui,sans-serif;font-weight:500;font-size:clamp(20px,3.4vw,26px);margin:0;flex:1;letter-spacing:-.2px}
  .iconbtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);transition:background .25s var(--ease),transform .15s var(--ease)}
  .iconbtn:hover{background:var(--surface2)} .iconbtn:active{transform:scale(.9)}
  .iconbtn:focus-visible,.card:focus-visible,.qcard:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .lead{color:var(--muted);font-size:16px;margin:4px 0 28px;line-height:1.5}
  .view{animation:in .45s var(--ease) both}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .view.out{animation:out .2s var(--ease) both}
  @keyframes out{to{opacity:0;transform:translateY(-8px)}}

  /* subject cards */
  .subjects{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:14px;padding:26px;border-radius:28px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);position:relative;overflow:hidden;transition:transform .3s var(--ease),background .3s var(--ease),box-shadow .3s var(--ease);min-height:240px}
  .card::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--c) 20%,transparent),transparent 60%);opacity:.9;pointer-events:none}
  .card:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--c)}
  .card:active{transform:scale(.98)}
  .card>*{position:relative}
  .badge{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
  .badge svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .card h2{font-family:"Google Sans",sans-serif;font-weight:500;font-size:28px;margin:6px 0 0;letter-spacing:-.3px}
  .card p{margin:0;color:var(--muted);line-height:1.5;font-size:15px}
  .card .meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:var(--c);font-weight:500;font-size:14px}
  .card .meta svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
  .card:hover .meta svg{transform:translateX(5px)}

  /* sections */
  .sect{margin:6px 0 30px}
  .sect h3{font-family:"Google Sans",sans-serif;font-weight:500;font-size:18px;margin:0 0 2px;display:flex;align-items:center;gap:10px}
  .sect h3 i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c)}
  .sect .sub{color:var(--muted);font-size:14px;margin:0 0 14px 20px}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .qcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:22px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease);animation:in .45s var(--ease) both}
  .qcard:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--c);background:var(--surface2)}
  .qcard:active{transform:scale(.98)}
  .qcard b{font-family:"Google Sans",sans-serif;font-weight:500;font-size:16px;line-height:1.3}
  .qcard span.d{color:var(--muted);font-size:13px;line-height:1.45}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:auto}
  .bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}
  .qcard:hover .bar{background:var(--bg)}
  .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .8s var(--ease)}

  /* detail */
  .detail{background:var(--surface);border-radius:28px;box-shadow:inset 0 0 0 1px var(--border);padding:clamp(20px,4vw,34px);position:relative;overflow:hidden}
  .detail::before{content:"";position:absolute;inset:0;background:radial-gradient(100% 70% at 100% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%);pointer-events:none}
  .detail>*{position:relative}
  .crumb{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:4px 10px;border-radius:99px}
  .detail h2{font-family:"Google Sans",sans-serif;font-weight:500;font-size:clamp(24px,4.6vw,34px);letter-spacing:-.4px;margin:12px 0 8px;line-height:1.15}
  .detail p.desc{margin:0 0 20px;color:var(--muted);line-height:1.55;font-size:16px;max-width:60ch}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
  .chip{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--surface2);color:var(--text)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 22px}
  .stat{padding:14px 10px;border-radius:18px;background:var(--surface2);text-align:center}
  .stat b{display:block;font-family:"Google Sans",sans-serif;font-weight:500;font-size:24px}
  .stat span{font-size:12px;color:var(--muted)}
  .tiers{display:flex;flex-direction:column;gap:9px;margin:0 0 26px}
  .tier{display:grid;grid-template-columns:92px 1fr 28px;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .tier .bar{height:8px}
  .tier em{font-style:normal;text-align:right;color:var(--text)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:99px;font-weight:500;font-size:16px;transition:transform .15s var(--ease),filter .2s,background .2s}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.08)} .btn:active{transform:scale(.96)}
  button.btn{font-family:inherit}
  .btn.ghost{color:var(--accent);box-shadow:inset 0 0 0 1px var(--border);padding:13px 20px;font-size:14px}
  .btn.ghost:hover{background:var(--surface2)}
  .btn svg{width:20px;height:20px;fill:currentColor}
  .empty{padding:36px 0;color:var(--muted);text-align:center}
  .soon{border-radius:22px;border:1px dashed var(--border);padding:18px 20px;color:var(--muted);font-size:14px}
  .tool{all:unset;cursor:pointer;display:flex;align-items:center;gap:16px;margin-top:16px;padding:20px 24px;border-radius:24px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);transition:transform .3s var(--ease),box-shadow .3s var(--ease);--c:var(--accent)}
  .tool:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px var(--c)} .tool:active{transform:scale(.99)} .tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tool .badge{width:48px;height:48px;border-radius:16px;flex:none}
  .tool b{display:block;font-family:"Google Sans",sans-serif;font-weight:500;font-size:18px;margin-bottom:2px}
  .tool span{color:var(--muted);font-size:14px;line-height:1.4}
  .tool .go{margin-left:auto;width:22px;height:22px;fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
  /* quiz overlay */
  .play{position:fixed;inset:0;z-index:50;background:var(--bg);animation:fade .25s var(--ease) both}
  .play iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  /* share page */
  .drop{display:block;border:2px dashed var(--border);border-radius:28px;padding:clamp(28px,6vw,52px) 20px;text-align:center;background:var(--surface);transition:border-color .25s,background .25s,transform .25s var(--ease);cursor:pointer}
  .drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));transform:scale(1.01)}
  .drop svg{width:44px;height:44px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
  .drop b{display:block;font-family:"Google Sans",sans-serif;font-weight:500;font-size:20px;margin-bottom:6px}
  .drop span{color:var(--muted);font-size:14px}
  .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:18px 0}
  .or::before,.or::after{content:"";height:1px;background:var(--border);flex:1}
  textarea{width:100%;min-height:110px;resize:vertical;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:14px 16px;font:14px/1.5 ui-monospace,Consolas,monospace;outline:none;transition:border-color .2s}
  textarea:focus{border-color:var(--accent)}
  .files{display:flex;flex-direction:column;gap:12px;margin-top:20px}
  .file{background:var(--surface);border-radius:22px;box-shadow:inset 0 0 0 1px var(--border);padding:16px 18px;animation:in .4s var(--ease) both}
  .file .h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .file .h b{font-weight:500;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file .h small{color:var(--muted);font-size:12px;white-space:nowrap}
  .kind{font-size:11px;font-weight:500;letter-spacing:.3px;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
  .urlrow{display:flex;gap:8px;align-items:stretch}
  .urlrow input{flex:1;min-width:0;border-radius:99px;border:1px solid var(--border);background:var(--surface2);color:var(--text);padding:11px 16px;font:13px ui-monospace,Consolas,monospace;outline:none}
  .copy{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:0 20px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:14px;transition:transform .15s var(--ease),filter .2s,background .25s}
  .copy:hover{filter:brightness(1.08)} .copy:active{transform:scale(.95)} .copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .copy.ok{background:var(--sci);color:#06280f}
  .copy svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .mini{display:flex;gap:14px;margin-top:10px;font-size:13px}
  .mini a,.mini button{all:unset;cursor:pointer;color:var(--accent)} .mini a:hover,.mini button:hover{text-decoration:underline}
  .note{color:var(--muted);font-size:13px;line-height:1.5;margin-top:22px;max-width:62ch}
  @media (max-width:640px){
    .subjects{grid-template-columns:1fr} .card{min-height:0;padding:22px;border-radius:24px}
    .stats{grid-template-columns:1fr 1fr}
    .tier{grid-template-columns:80px 1fr 24px}
    .btn.primary{flex:1;justify-content:center}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="iconbtn" id="back" aria-label="Back" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="title">Study Quizzes</h1>
  </div>
  <div id="app"></div>
</div>
<script type="text/plain" id="shell"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__@@LT@@title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131314; --surface:#1b1c1d; --surface2:#282a2c; --border:#3c4043;
    --text:#e3e3e3; --muted:#a8abb0; --accent:#a8c7fa; --accent-ink:#062e6f;
    --good:#6dd58c; --good-bg:rgba(109,213,140,.12); --bad:#f2b8b5; --bad-bg:rgba(242,184,181,.12);
    --grad:linear-gradient(90deg,#4285f4,#9b72cb,#d96570);
    --ease:cubic-bezier(.2,0,0,1); --ease-in:cubic-bezier(.3,0,.8,.15);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f0f4f9; --surface:#ffffff; --surface2:#f0f4f9; --border:#dadce0;
      --text:#1f1f1f; --muted:#5f6368; --accent:#0b57d0; --accent-ink:#ffffff;
      --good:#146c2e; --good-bg:#e6f4ea; --bad:#b3261e; --bad-bg:#fce8e6;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Google Sans Text","Google Sans",Roboto,system-ui,sans-serif;height:100dvh;overflow:hidden;display:flex;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:1200px;height:100%;display:flex;flex-direction:column;min-height:0}
  header{display:flex;align-items:center;gap:12px;margin:0 0 12px 4px;flex:none}
  .spark{width:28px;height:28px;flex:none}
  h1{font-family:"Google Sans",sans-serif;font-weight:500;font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .card{background:var(--surface);border-radius:24px;padding:24px 32px;flex:1;min-height:0;display:flex;flex-direction:column}
  .qbody{flex:1;min-height:0;overflow:auto;overflow-x:hidden;display:flex;flex-direction:column;justify-content:safe center;width:100%;max-width:760px;margin:0 auto}
  .qbody.withmap{max-width:none;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:32px;align-items:safe center;overflow:hidden}
  .mapcol{height:100%;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
  .side{display:flex;flex-direction:column;justify-content:safe center;min-height:0;max-height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin}
  .resultwrap{flex:1;min-height:0;overflow:auto}
  .topline{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:10px}
  .bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:24px}
  .bar>div{height:100%;background:var(--grad);border-radius:99px;transition:width .4s ease}
  .tag{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:4px 10px;border-radius:99px;margin-bottom:12px}
  .q{font-family:"Google Sans",sans-serif;font-size:clamp(20px,2.6vw,28px);line-height:1.45;font-weight:500;margin:0 0 18px}
  .mapbox{position:relative;border-radius:16px;overflow:hidden;width:min(100cqw,calc(100cqh * var(--ar,1)));background:#fff;box-shadow:0 0 0 1px var(--border)}
  .mapbox img{display:block;width:100%;height:100%;object-fit:contain}
  .pin{position:absolute;transform:translate(-50%,-50%);width:clamp(26px,3.2vw,38px);height:clamp(26px,3.2vw,38px);border-radius:50%;background:#1a73e8;color:#fff;font:700 clamp(13px,1.5vw,18px) "Google Sans",sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:background .4s var(--ease)}
  .pin.hl{background:#d93025;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.18)}}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{all:unset;cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;padding:14px 16px;background:transparent;transition:background .35s var(--ease),border-color .35s var(--ease),opacity .35s var(--ease),transform .2s var(--ease)}
  .opt:hover:not(.locked){background:var(--surface2)}
  .opt:active:not(.locked){transform:scale(.985)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;align-items:center;gap:14px}
  .letter{flex:none;min-width:22px;font:500 16px "Google Sans",sans-serif;color:var(--muted)}
  .otext{font-size:clamp(15px,1.4vw,18px);line-height:1.4}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.correct .letter{color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .letter{color:var(--bad)}
  .opt.dim{opacity:.55}
  /* smooth expanding panels (grid 0fr -> 1fr) */
  .grow{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s var(--ease),opacity .35s var(--ease)}

  .grow.open{grid-template-rows:1fr;opacity:1}

  .why b{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .opt.correct .why b{color:var(--good)} .opt.wrong .why b{color:var(--bad)}
  .hintarea{transition:opacity .3s var(--ease)}
  .hintarea.gone{opacity:0;pointer-events:none}
  .hintbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:14px;font-weight:500;margin-top:16px;padding:6px 10px;border-radius:99px;transition:background .2s var(--ease)}
  .hintbtn:hover{background:var(--surface2)}
  .hintbtn .car{display:inline-block;transition:transform .35s var(--ease)}
  .hintbtn.on .car{transform:rotate(180deg)}
  .hint{margin-top:8px;padding:12px 16px;border-radius:14px;background:var(--surface2);font-size:14px;line-height:1.5;color:var(--muted)}
  /* question slide transitions */
  .qbody{animation:none}
  .qbody.in-r{animation:inR .45s var(--ease) both}
  .qbody.in-l{animation:inL .45s var(--ease) both}
  .qbody.out-l{animation:outL .22s var(--ease-in) both}
  .qbody.out-r{animation:outR .22s var(--ease-in) both}
  @keyframes inR{from{opacity:0;transform:translateX(40px)}}
  @keyframes inL{from{opacity:0;transform:translateX(-40px)}}
  @keyframes outL{to{opacity:0;transform:translateX(-40px)}}
  @keyframes outR{to{opacity:0;transform:translateX(40px)}}
  .opts .opt{animation:rise .5s var(--ease) both}
  .qbody.static .opt{animation:none}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  /* score chips */
  .left{display:flex;align-items:center;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font:500 14px "Google Sans",sans-serif;transition:transform .3s var(--ease)}
  .chip.good{color:var(--good);background:var(--good-bg)}
  .chip.bad{color:var(--bad);background:var(--bad-bg)}
  .chip.bump{animation:bump .5s var(--ease)}
  @keyframes bump{40%{transform:scale(1.25)}}
  .fadein{animation:fadeUp .5s var(--ease) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
  .rv{animation:rise .5s var(--ease) both}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
/*__IMGS__*/
const LETTERS = "ABCDEFGH";
const ICONS={check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  up:'<path d="M12 19V5M6 11l6-6 6 6"/>',right:'<path d="M5 12h14M13 6l6 6-6 6"/>',down:'<path d="M6 9l6 6 6-6"/>'};
const ic=(n,cls="")=>`<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}@@LT@@svg>`;

/*__QUIZ__*/

let order, answers, idx, opts;
const $card = document.getElementById("card");

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let navTimer = null, target = null, shown = {good:-1,bad:-1};

function shell(){
  $card.innerHTML = `
    <div class="topline"><div class="left"><span id="count">@@LT@@span>
      <span class="chip good">${ic("check")}<b id="ng">0@@LT@@b><span class="w"> correct@@LT@@span>@@LT@@span>
      <span class="chip bad">${ic("x")}<b id="nb">0@@LT@@b><span class="w"> incorrect@@LT@@span>@@LT@@span>@@LT@@div><span id="qtier">@@LT@@span>@@LT@@div>
    <div id="stage" style="flex:1;min-height:0;display:flex;flex-direction:column">@@LT@@div>
    <div class="nav">
      <button class="btn ghost" id="prev">Previous@@LT@@button>
      <button class="btn primary" id="next">Next@@LT@@button>
    @@LT@@div>`;
  $card.classList.remove("fadein"); void $card.offsetWidth; $card.classList.add("fadein");
  document.getElementById("prev").onclick=()=>go(-1);
  document.getElementById("next").onclick=()=>{
    const cur = target ?? idx;
    if(answers[order[cur]]===null) return;
    if(cur<order.length-1) go(1); else go("end");
  };
  shown={good:-1,bad:-1};
}

function start(){
  order = QUIZ.map((_,i)=>i);
  opts = QUIZ.map(q=>shuffle([q.a,...q.wrong]));
  answers = Array(QUIZ.length).fill(null);
  idx = 0; clearTimeout(navTimer); navTimer=null; target=null; shell(); render("r");
}

function tally(){
  let g=0,b=0; order.forEach(i=>{ if(answers[i]!==null){ answers[i]===QUIZ[i].a?g++:b++ } });
  return {g,b};
}

function updateTop(){
  document.getElementById("count").textContent = `${idx+1} / ${order.length}`;
  document.getElementById("qtier").innerHTML = tierBadge(lvl(order[idx]));
  const {g,b}=tally();
  [["ng",g,"good"],["nb",b,"bad"]].forEach(([id,v,k])=>{
    const el=document.getElementById(id);
    if(shown[k]!==-1 && v>shown[k]){const c=el.parentElement;c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
    el.textContent=v; shown[k]=v;
  });
  const prev=document.getElementById("prev"), next=document.getElementById("next");
  prev.disabled = idx===0;
  next.disabled = answers[order[idx]]===null;
  next.textContent = idx===order.length-1 ? "See results" : "Next";
}

// Navigation never swallows clicks: rapid Previous/Next presses are combined
// into one target and the screen jumps there once the slide-out finishes.
function go(d){
  const base = target ?? idx;
  let n;
  if(d==="end") n="end";
  else { n=base+d; if(n<0||n>=order.length) return; }
  const firstPress = navTimer===null;
  target = n;
  if(firstPress){
    const qb=document.querySelector("#stage .qbody");
    if(qb){ qb.classList.remove("in-l","in-r","static"); void qb.offsetWidth; qb.classList.add(n==="end"||n>idx?"out-l":"out-r"); }
  } else clearTimeout(navTimer);
  // keep the counter/buttons in sync with where we're heading
  if(n!=="end"){
    document.getElementById("count").textContent = `${n+1} / ${order.length}`;
    document.getElementById("prev").disabled = n===0;
  }
  navTimer = setTimeout(()=>{
    navTimer=null; const t=target; target=null;
    if(t==="end"){ results(); return; }
    const dir = t>idx ? "r" : "l"; idx=t; render(dir);
  }, firstPress?210:120);
}

function picHTML(Q){
  const I=IMGS[Q.img], ar=I.w/I.h;
  return `<div class="mapbox" style="aspect-ratio:${I.w}/${I.h};--ar:${ar}"><img src="${I.u}" alt="${ALTS[Q.img].replace(/"/g,'&quot;')}">@@LT@@div>`;
}

function optClass(o,Q,chosen){
  if(chosen===null) return "opt";
  if(o===Q.a) return "opt locked correct";
  if(o===chosen) return "opt locked wrong";
  return "opt locked dim";
}
function whyHTML(o,Q,chosen){
  if(chosen===null) return "";
  if(o===Q.a) return `<b>${ic("check")}Right answer@@LT@@b>${Q.ex}`;
  if(o===chosen) return `<b>${ic("x")}Not quite@@LT@@b>The correct answer is ${Q.a}.`;
  return "";
}

function render(dir){
  const qi = order[idx], Q = QUIZ[qi], chosen = answers[qi], done = chosen!==null;
  document.getElementById("stage").innerHTML = `
    <div class="qbody${Q.img?' withmap':''} in-${dir}">
    ${Q.img?`<div class="mapcol">${picHTML(Q)}@@LT@@div><div class="side">`:""}
    <p class="q">${Q.q}@@LT@@p>
    <div class="opts">${opts[qi].map((o,i)=>{
      const w=whyHTML(o,Q,chosen);
      return `<button class="${optClass(o,Q,chosen)}" style="animation-delay:${80+i*55}ms" data-o="${encodeURIComponent(o)}" ${done?'tabindex="-1"':''}>
        <div class="row"><span class="letter">${LETTERS[i]}.@@LT@@span><span class="otext">${o}@@LT@@span>@@LT@@div>
        <div class="grow${w?' open':''}"><div><div class="why">${w}@@LT@@div>@@LT@@div>@@LT@@div>@@LT@@button>`;
    }).join("")}@@LT@@div>
    ${done?"":`<div class="hintarea"><button class="hintbtn" id="hb">Hint <span class="car">${ic("down")}@@LT@@span>@@LT@@button>
      <div class="grow" id="hint"><div><div class="hint">${Q.hint}@@LT@@div>@@LT@@div>@@LT@@div>@@LT@@div>`}
    ${Q.img?"@@LT@@div>":""}@@LT@@div>`;
  const qb=document.querySelector("#stage .qbody");
  qb.addEventListener("animationend",e=>{if(e.target===qb) qb.classList.add("static")},{once:false});
  document.querySelectorAll("#stage .opt").forEach(b=>b.onclick=()=>choose(b));
  const hb=document.getElementById("hb");
  if(hb) hb.onclick=()=>{hb.classList.toggle("on");document.getElementById("hint").classList.toggle("open")};
  updateTop();
}

function choose(btn){
  const qi=order[idx], Q=QUIZ[qi];
  if(answers[qi]!==null||navTimer!==null) return;
  const chosen=decodeURIComponent(btn.dataset.o);
  answers[qi]=chosen;
  document.querySelectorAll("#stage .opt").forEach(b=>{
    const o=decodeURIComponent(b.dataset.o), w=whyHTML(o,Q,chosen);
    b.style.animation="none";
    b.className=optClass(o,Q,chosen); b.tabIndex=-1;
    if(w){ b.querySelector(".why").innerHTML=w; requestAnimationFrame(()=>b.querySelector(".grow").classList.add("open")); }
  });
  const ha=document.querySelector("#stage .hintarea");
  if(ha){ ha.classList.add("gone"); ha.querySelector(".grow").classList.remove("open"); }
  updateTop();
}

/* ---------- mastery tiers ---------- */
const TIERS=["Not started","Decent","Good","Proficient","Mastered"];
const TCOL=["var(--muted)","#f6ad55","#fdd663","#8ab4f8","#6dd58c"];
const KEY="__KEY__";
let mastery={};
try{mastery=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){mastery={}}
const lvl=i=>mastery[QUIZ[i].q]||0;
function saveM(){try{localStorage.setItem(KEY,JSON.stringify(mastery))}catch(e){}}
function pips(l){return `<span class="pips">${[1,2,3,4].map(k=>`<i class="${k<=l?'on':''}" style="${k<=l?`background:${TCOL[l]}`:''}">@@LT@@i>`).join("")}@@LT@@span>`}
function tierBadge(l,up){return `<span class="tier${up?' up':''}" style="--tc:${TCOL[l]}"><span class="tl">${up?ic('up'):''}${TIERS[l]}@@LT@@span> ${pips(l)}@@LT@@span>`}

// red = bad, yellow = okay, green = good
const STOPS=[[0,[238,103,92]],[35,[246,155,85]],[60,[253,214,99]],[80,[168,218,120]],[100,[91,185,116]]];
function scoreColor(p){for(let i=1;i<STOPS.length;i++){const [a,ca]=STOPS[i-1],[b,cb]=STOPS[i];if(p<=b){const t=(p-a)/(b-a);return `rgb(${ca.map((v,j)=>Math.round(v+(cb[j]-v)*t)).join(",")})`}}return "rgb(91,185,116)"}
function score(){return order.reduce((s,i)=>s+(answers[i]===QUIZ[i].a?1:0),0)}

function results(){
  const s=score(), n=order.length, pct=Math.round(s/n*100), C=2*Math.PI*64;
  // level up every question answered correctly this round
  const before={}, ups=[];
  order.forEach(i=>{const l=lvl(i); before[i]=l; if(answers[i]===QUIZ[i].a && l<4){mastery[QUIZ[i].q]=l+1; ups.push(i)}});
  saveM();
  const counts=[0,0,0,0,0]; QUIZ.forEach((_,i)=>counts[lvl(i)]++);
  const total=QUIZ.length, mastered=counts[4];
  const msg = pct===100?"Perfect round! Every question moved up a tier.":pct>=80?"Great job! Review the few you missed and go again.":pct>=60?"Good effort — check what you missed below and try again.":"Keep going — every correct answer levels a question up.";
  $card.innerHTML=`<div class="resultwrap fadein"><div class="result">
    <div class="ring"><div class="track">@@LT@@div><div class="arc" id="arc">@@LT@@div><div class="cap" id="cap" style="opacity:${pct>0?1:0}">@@LT@@div>
      <div class="num"><b><span id="cu">0@@LT@@span>/${n}@@LT@@b><span id="pc">0%@@LT@@span>@@LT@@div>@@LT@@div>
    <h2>${pct>=80?"Nice work!":"Round complete"}@@LT@@h2><p>${msg}@@LT@@p>
    <div class="rsplit"><span class="chip good">${ic("check")}${s} correct@@LT@@span><span class="chip bad">${ic("x")}${n-s} incorrect@@LT@@span>${ups.length?`<span class="chip lvl">${ic("up")}${ups.length} leveled up@@LT@@span>`:""}@@LT@@div>

    <div class="mastery">
      <div class="mhead"><span>Mastery@@LT@@span><span>${mastered} / ${total} mastered@@LT@@span>@@LT@@div>
      <div class="mbar">${[4,3,2,1,0].map(l=>counts[l]?`<div class="seg" data-w="${counts[l]/total*100}" style="background:${l?TCOL[l]:'var(--surface2)'}">@@LT@@div>`:"").join("")}@@LT@@div>
      <div class="mlegend">${[1,2,3,4].map(l=>`<span><i style="background:${TCOL[l]}">@@LT@@i>${TIERS[l]} <b>${counts[l]}@@LT@@b>@@LT@@span>`).join("")}<span><i style="background:var(--surface2)">@@LT@@i>Not started <b>${counts[0]}@@LT@@b>@@LT@@span>@@LT@@div>
    @@LT@@div>

    <div class="btns"><button class="btn primary" id="retake">Try again@@LT@@button><button class="btn ghost" id="missed">Retry missed (${n-s})@@LT@@button>@@LT@@div>

    <div class="review">${order.map((i,k)=>{const q=QUIZ[i], ok=answers[i]===q.a, up=ups.includes(i);
      return `<div class="rv ${ok?'rok':'rno'}" style="animation-delay:${300+k*40}ms">
        <div class="rtop"><div class="rq">${i+1}. ${q.q}@@LT@@div>${tierBadge(lvl(i),up)}@@LT@@div>${
      ok?`<span class="ok">${ic("check")}${q.a}@@LT@@span>`:`<span class="no">${ic("x")}You chose: ${answers[i]}@@LT@@span><br><span class="ok">${ic("check")}Correct: ${q.a}@@LT@@span>`}@@LT@@div>`}).join("")}@@LT@@div>
    <button class="reset" id="reset">Reset mastery progress@@LT@@button>
  @@LT@@div>@@LT@@div>`;
  requestAnimationFrame(()=>setTimeout(()=>{
    document.getElementById("arc").style.setProperty("--p",pct);
    if(pct>0) document.querySelector(".ring").classList.add("go");
    document.querySelectorAll(".mbar .seg").forEach(sg=>sg.style.width=sg.dataset.w+"%");
  },80));
  const t0=performance.now(), cu=document.getElementById("cu"), pc=document.getElementById("pc");
  const cap=document.getElementById("cap"), ring=document.querySelector(".ring");
  (function tick(t){const k=Math.min(1,(t-t0)/1400), e=1-Math.pow(1-k,3), p=pct*e;
    cu.textContent=Math.round(s*e);pc.textContent=Math.round(p)+"%";
    const col=scoreColor(p); pc.style.color=col; cap.style.background=col; ring.style.setProperty("--c",col); cap.style.transform=`rotate(${p*3.6}deg)`;
    if(k<1)requestAnimationFrame(tick)})(t0);
  document.getElementById("retake").onclick=start;
  const m=document.getElementById("missed");
  if(s===n) m.disabled=true;
  m.onclick=()=>{const miss=order.filter(i=>answers[i]!==QUIZ[i].a); if(!miss.length)return;
    miss.forEach(i=>{answers[i]=null;opts[i]=shuffle(opts[i])}); order=miss; idx=0; navTimer=null; target=null;
    shell(); render("r");};
  document.getElementById("reset").onclick=e=>{
    if(e.target.dataset.sure){mastery={};saveM();start();return}
    e.target.dataset.sure=1; e.target.textContent="Tap again to confirm reset";};
}


/* ---------- music popup ---------- */
(function(){
  const URL="https://invidious.tiekoetter.com/";
  const scrim=document.getElementById("scrim"), go=document.getElementById("mgo");
  let timer=null, tickT=null, opened=false; const cd=document.getElementById("cd");
  function close(){ clearTimeout(timer); clearInterval(tickT); timer=null; scrim.classList.remove("open"); go.classList.remove("pulse"); }
  function openMusic(){
    clearTimeout(timer); clearInterval(tickT); timer=null;
    if(opened) return; opened=true; cd.textContent="Opening…";
    const w=window.open(URL,"_blank","noopener");
    // popup blockers return null with noopener in some browsers, so only treat a
    // still-visible page as "blocked": the button stays for a manual tap
    setTimeout(()=>{ if(!document.hidden && document.hasFocus()){ opened=false; go.textContent="Tap to open"; go.classList.add("pulse"); cd.textContent="Your browser blocked it — tap below"; } },700);
  }
  document.getElementById("music").onclick=()=>{
    opened=false; go.textContent="Open now";
    scrim.classList.remove("open"); void scrim.offsetWidth; scrim.classList.add("open");
    let left=5; cd.textContent="Opening in 5…";
    clearInterval(tickT); tickT=setInterval(()=>{left--; cd.textContent=left>0?`Opening in ${left}…`:"Opening…"; if(left<=0)clearInterval(tickT)},1000);
    timer=setTimeout(openMusic,4900);
  };
  go.onclick=openMusic;
  document.getElementById("mcancel").onclick=close;
  scrim.addEventListener("click",e=>{ if(e.target===scrim) close(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
  // once they leave for the music tab, the popup is gone when they come back
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) close(); });
  window.addEventListener("blur",()=>{ if(opened) close(); });
  // coming back from the music tab: make sure it's gone
  window.addEventListener("focus",()=>{ if(opened && scrim.classList.contains("open") && go.textContent!=="Tap to open") close(); });
  window.addEventListener("pageshow",()=>{ if(opened) close(); });
})();

/* ---------- swipe between questions on phones ---------- */
(function(){
  let sx=0, sy=0, st=0;
  $card.addEventListener("touchstart",e=>{const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();},{passive:true});
  $card.addEventListener("touchend",e=>{
    if(!document.getElementById("stage")) return;
    const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st>600 || Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
    if(dx>0) go(-1);
    else document.getElementById("next").click();
  },{passive:true});
})();

start();

  {"tag": "Skeletal", "q": "What are the three main jobs of the skeletal system?", "a": "Support the body, allow movement with muscles, and protect vital organs", "wrong": ["Pump blood, fight germs, and make hormones", "Digest food, filter blood, and make urine", "Sense touch, send signals, and cool the body"], "hint": "Remember: stand up, move, protect.", "ex": "The skeletal system supports the body, allows movement with muscles, and protects vital organs. It also makes blood cells and stores calcium."},

  {"tag": "Nervous", "q": "What is the memory phrase for the nervous system?", "a": "Sends signals! Input - Output", "wrong": ["If it moves, it's muscle", "Stand up, move, protect", "Cargo transport"], "hint": "It is about signals.", "ex": "The nervous system sends signals in and out of the body."},

  {"tag": "Nervous", "q": "Where do nervous system signal inputs come from?", "a": "Sensory organs like touch, smell, and sight", "wrong": ["The stomach and intestines", "The bones", "The kidneys"], "hint": "Think about your senses.", "ex": "Signal inputs come from sensory organs."},
  {"tag": "Nervous", "q": "Where do nervous system outputs come from?", "a": "The brain, sending signals to body parts to make things happen", "wrong": ["The skin, sending signals to the brain", "The kidneys, sending hormones", "The lungs, sending oxygen"], "hint": "Movement is an example.", "ex": "Outputs come from the brain to body parts to produce movement or chemicals."},
  {"tag": "Nervous", "q": "What happens when you touch a hot stove?", "a": "Sensors send a signal to the brain, which tells muscles to move away", "wrong": ["Hormones tell your bones to heal", "Your stomach acid rises", "Your kidneys filter the heat"], "hint": "Input first, then output.", "ex": "The nervous system senses the heat (input) and the brain sends a signal to your muscles to move (output)."},

  {"tag": "Nervous", "img": "nerve", "q": "On this nerve cell, which letter is the axon that the signal travels down?", "a": "C", "wrong": ["A", "B", "D"], "hint": "It is the long part.", "ex": "The signal travels down the axon, labeled C."},

const $=s=>document.querySelector(s), app=$("#app");
function stat(q){
  let m={};try{m=JSON.parse(localStorage.getItem(q.key)||"{}")}catch(e){}
  const c=[0,0,0,0,0];let sum=0;
  Object.values(m).forEach(v=>{v=Math.max(0,Math.min(4,+v||0));c[v]++;sum+=v});
  const seen=c[1]+c[2]+c[3]+c[4]; c[0]=Math.max(0,q.n-seen);
  return {c,pct:Math.round(sum/(4*q.n)*100),started:seen>0};
}
function pctColor(p){return `hsl(${Math.round(p*1.2)} 62% 56%)`}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setView(html,title,back){
  const go=()=>{app.innerHTML=`<div class="view">${html}</div>`;$("#title").textContent=title;const b=$("#back");b.hidden=!back;b.onclick=()=>{location.hash=back};
    document.title=title==="Study Quizzes"?title:title+" · Study Quizzes";window.scrollTo(0,0);
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bar i[data-w]").forEach(i=>i.style.width=i.dataset.w+"%")))};
  const old=app.firstElementChild; if(old&&!matchMedia("(prefers-reduced-motion:reduce)").matches){old.classList.add("out");setTimeout(go,170)}else go();
}
function home(){
  const total=SUBJECTS.reduce((a,s)=>a+s.cats.reduce((b,c)=>b+c.quizzes.length,0),0);
  setView(`<p class="lead">Pick a subject to see its quizzes.</p><div class="subjects">`+SUBJECTS.map(s=>{
    const qs=s.cats.flatMap(c=>c.quizzes);
    return `<button class="card" style="--c:${s.color}" data-go="#/${s.id}"><div class="badge">${ICON[s.icon]}</div><h2>${s.name}</h2><p>${s.blurb}</p><div class="meta"><span>${s.cats.length} categories · ${qs.length} quizzes</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></button>`}).join("")+`</div><a class="tool" href="opener.html"><div class="badge" style="--c:var(--accent)"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></div><div><b>Opener</b><span>Upload any file with HTML in it and get a link to copy or open.</span></div><svg class="go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>`,"Study Quizzes",null);
}

function subject(s){
  setView(`<p class="lead">${s.blurb}</p>`+s.cats.map((c,ci)=>`<section class="sect" style="--c:${s.color}"><h3><i></i>${c.name}</h3><p class="sub">${c.sub}</p><div class="qgrid">`+c.quizzes.map((q,i)=>{
    const st=stat(q);
    return `<button class="qcard" style="--c:${s.color};animation-delay:${(ci*3+i)*60}ms" data-go="#/${s.id}/${q.id}"><b>${esc(q.title)}</b><span class="d">${esc(q.desc)}</span><div class="row"><div class="bar"><i data-w="${st.pct}" style="background:${pctColor(st.pct)}"></i></div><span>${st.started?st.pct+"%":q.n+" questions"}</span></div></button>`}).join("")+`</div></section>`).join(""),s.name,"#/");
}
function detail(s,q,cat){
  const st=stat(q), c=st.c;
  const tiers=[4,3,2,1,0].map(t=>`<div class="tier"><span>${TIERS[t]}</span><div class="bar"><i data-w="${q.n?c[t]/q.n*100:0}" style="background:${TCOL[t]}"></i></div><em>${c[t]}</em></div>`).join("");
  setView(`<div class="detail" style="--c:${s.color}"><span class="crumb">${s.name} · ${cat.name}</span><h2>${esc(q.title)}</h2><p class="desc">${esc(q.desc)}</p>
   <div class="chips">${q.topics.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>
   <div class="stats"><div class="stat"><b>${q.n}</b><span>Questions</span></div><div class="stat"><b>${c[4]}</b><span>Mastered</span></div><div class="stat"><b style="color:${pctColor(st.pct)}">${st.pct}%</b><span>Progress</span></div><div class="stat"><b>4</b><span>Mastery tiers</span></div></div>
   <div class="tiers">${tiers}</div>
   <div class="actions"><button class="btn primary" data-start><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>${st.started?"Continue quiz":"Start quiz"}</button>${st.started?`<button class="btn ghost" data-reset>Reset progress</button>`:""}</div></div>`,q.title,`#/${s.id}`);
  cur={s,q};
}
let overlay=null;
function closePlay(){if(overlay){overlay.remove();overlay=null;document.documentElement.style.overflow=""}}
function qdata(id){const el=document.getElementById("d-"+id);const dec=t=>t.split("@@LT@@").join("</").split("@@CM@@").join("<!--");return dec(el.textContent).split("\n@@SPLIT@@\n")}
function play(s,q){
  closePlay();
  const sh=document.getElementById("shell").textContent; const [im,qz]=qdata(q.data);
  const dec=t=>t.split("@@LT@@").join("</").split("@@CM@@").join("<!--");
  const doc=dec(sh).split("__TITLE__").join(q.title).split("__KEY__").join(q.key).replace("/*__IMGS__*/",()=>im).replace("/*__QUIZ__*/",()=>qz);
  overlay=document.createElement("div"); overlay.className="play";
  const fr=document.createElement("iframe"); fr.title=q.title; fr.srcdoc=doc; overlay.appendChild(fr);
  document.body.appendChild(overlay); document.documentElement.style.overflow="hidden";
}
addEventListener("message",e=>{if(e.data==="quiz-back"){const p=location.hash.split("/");location.hash=p.length>3?p.slice(0,3).join("/"):"#/"}});
function route(instant){
  const [,sid,qid,mode]=location.hash.split("/"); const s=SUBJECTS.find(x=>x.id===sid);
  if(mode!=="play")closePlay();
  if(instant)app.innerHTML="";
  if(sid==="share") return share();
  if(!s) return home();
  if(mode==="play"){for(const c of s.cats){const q=c.quizzes.find(x=>x.id===qid); if(q){ if(!app.firstElementChild)detail(s,q,c); return play(s,q)}}}
  if(!qid) return subject(s);
  for(const c of s.cats){const q=c.quizzes.find(x=>x.id===qid); if(q) return detail(s,q,c)}
  subject(s);
}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]"); if(g) location.hash=g.dataset.go});
addEventListener("hashchange",()=>route());

/* ---------- File to link ---------- */
const files=[];
function fmt(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB"}
async function sniff(blob,name){
  let type=(blob.type||"").toLowerCase(), kind="File";
  try{
    const ext=(name.split(".").pop()||"").toLowerCase();
    const head=await blob.slice(0,65536).arrayBuffer();
    let text=null; try{text=new TextDecoder("utf-8",{fatal:true}).decode(head)}catch(e){ if(head.byteLength>=65536){try{text=new TextDecoder("utf-8").decode(head.slice(0,65530))}catch(_){}} }
    const looksHtml=text!==null&&/^\s*(<!doctype html|<html|<head|<body|<svg)|<\s*(div|p|h1|script|style|body|a|table)\b/i.test(text);
    if(ext==="html"||ext==="htm"||type==="text/html"||(text!==null&&(!type||type==="text/plain"||type==="application/octet-stream")&&looksHtml)){type="text/html";kind="HTML"}
    else if(text!==null&&(!type||type==="application/octet-stream"||type.startsWith("text/")||/json|xml|javascript/.test(type))){ if(!type||type==="application/octet-stream")type=ext==="json"?"application/json":ext==="css"?"text/css":ext==="js"?"text/javascript":"text/plain"; kind="Text"}
    else if(type.startsWith("image/"))kind="Image"; else if(type==="application/pdf")kind="PDF"; else if(!type)type="application/octet-stream";
    if(type.startsWith("text/")&&!/charset/.test(type))type+=";charset=utf-8";
  }catch(e){ if(!type)type="application/octet-stream" }
  return {type,kind};
}
async function addBlob(blob,name){
  try{
    const {type,kind}=await sniff(blob,name);
    const b=new Blob([blob],{type}); const url=URL.createObjectURL(b);
    files.unshift({name,url,kind,size:b.size}); renderFiles();
  }catch(e){ files.unshift({name,url:"",kind:"File",size:0,err:true}); renderFiles() }
}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}
function renderFiles(){
  const box=$("#files"); if(!box)return;
  box.innerHTML=files.map((f,i)=>f.err?`<div class="file"><div class="h"><b>${esc(f.name)}</b></div><div class="note" style="margin:0">Couldn't read this file, but nothing broke. Try it again.</div></div>`:
   `<div class="file"><div class="h"><b title="${esc(f.name)}">${esc(f.name)}</b><span class="kind">${f.kind}</span><small>${fmt(f.size)}</small></div>
    <div class="urlrow"><input readonly value="${f.url}" aria-label="Link" onfocus="this.select()"><button class="copy" data-i="${i}"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span>Copy</span></button></div>
    <div class="mini"><a href="${f.url}" target="_blank" rel="noopener">Open</a><button data-rm="${i}">Remove</button></div></div>`).join("");
}
function share(){
  setView(`<p class="lead">Upload any file, or paste text or HTML, and get a link you can copy.</p>
   <label class="drop" id="drop" tabindex="0"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><b>Drop files here</b><span>or tap to choose. Any file type works.</span><input id="pick" type="file" multiple hidden></label>
   <div class="or">or paste text or HTML</div>
   <textarea id="paste" placeholder="Paste text or HTML here" spellcheck="false"></textarea>
   <div class="actions" style="margin-top:12px"><button class="btn primary" id="mk" style="padding:12px 22px;font-size:15px">Make link</button></div>
   <div class="files" id="files"></div>
   <p class="note">Links are created in your browser and work in this browser until you close or reload the page. Nothing is uploaded anywhere. For a permanent link, add the file to your GitHub repo.</p>`,"File to link","#/");
  renderFiles();
  const drop=$("#drop"),pick=$("#pick");
  const take=list=>{[...list].forEach(f=>addBlob(f,f.name||"file"))};
  pick.onchange=()=>{take(pick.files);pick.value=""};
  ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>{if(e.dataTransfer&&e.dataTransfer.files)take(e.dataTransfer.files)});
  drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick.click()}});
  $("#mk").onclick=()=>{const v=$("#paste").value; if(!v.trim())return; const isH=/<\s*(!doctype|html|body|div|p|h1|script|style)\b/i.test(v); addBlob(new Blob([v],{type:isH?"text/html":"text/plain"}),isH?"pasted.html":"pasted.txt"); $("#paste").value=""};
}
let cur=null;
document.addEventListener("click",e=>{
  if(cur&&e.target.closest("[data-start]")){location.hash=`#/${cur.s.id}/${cur.q.id}/play`;return}
  const rs=e.target.closest("[data-reset]"); if(rs&&cur){ if(rs.dataset.sure){try{localStorage.removeItem(cur.q.key)}catch(_){}route(true)}else{rs.dataset.sure=1;rs.textContent="Tap again to confirm";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.sure;rs.textContent="Reset progress"}},3000)} return}
  const c=e.target.closest(".copy"); if(c){const f=files[+c.dataset.i]; copyText(f.url).then(()=>{c.classList.add("ok");c.querySelector("span").textContent="Copied";setTimeout(()=>{c.classList.remove("ok");c.querySelector("span").textContent="Copy"},1600)}); return}
  const r=e.target.closest("[data-rm]"); if(r){const f=files.splice(+r.dataset.rm,1)[0]; try{URL.revokeObjectURL(f.url)}catch(_){} renderFiles()}
});
addEventListener("dragover",e=>e.preventDefault()); addEventListener("drop",e=>{if(!e.target.closest||!e.target.closest("#drop"))e.preventDefault()});
addEventListener("pageshow",e=>{if(e.persisted)route(true)});
route(true);
</script>
