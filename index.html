<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 3 Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131314; --surface:#1b1c1d; --surface2:#282a2c; --border:#3c4043;
    --text:#e3e3e3; --muted:#a8abb0; --accent:#a8c7fa; --accent-ink:#062e6f;
    --good:#6dd58c; --good-bg:rgba(109,213,140,.12); --bad:#f2b8b5; --bad-bg:rgba(242,184,181,.12);
    --grad:linear-gradient(90deg,#4285f4,#9b72cb,#d96570);
    --ease:cubic-bezier(.2,0,0,1); --ease-in:cubic-bezier(.3,0,.8,.15);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f0f4f9; --surface:#ffffff; --surface2:#f0f4f9; --border:#dadce0;
      --text:#1f1f1f; --muted:#5f6368; --accent:#0b57d0; --accent-ink:#ffffff;
      --good:#146c2e; --good-bg:#e6f4ea; --bad:#b3261e; --bad-bg:#fce8e6;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Google Sans Text","Google Sans",Roboto,system-ui,sans-serif;height:100dvh;overflow:hidden;display:flex;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:1200px;height:100%;display:flex;flex-direction:column;min-height:0}
  header{display:flex;align-items:center;gap:12px;margin:0 0 12px 4px;flex:none}
  .spark{width:28px;height:28px;flex:none}
  h1{font-family:"Google Sans",sans-serif;font-weight:500;font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:14px;margin-top:2px}
  .card{background:var(--surface);border-radius:24px;padding:24px 32px;flex:1;min-height:0;display:flex;flex-direction:column}
  .qbody{flex:1;min-height:0;overflow:auto;overflow-x:hidden;display:flex;flex-direction:column;justify-content:safe center;width:100%;max-width:760px;margin:0 auto}
  .qbody.withmap{max-width:none;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:32px;align-items:center}
  .mapcol{height:100%;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
  .side{display:flex;flex-direction:column;justify-content:center;min-height:0}
  .resultwrap{flex:1;min-height:0;overflow:auto}
  .topline{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:10px}
  .bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:24px}
  .bar>div{height:100%;background:var(--grad);border-radius:99px;transition:width .4s ease}
  .tag{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:4px 10px;border-radius:99px;margin-bottom:12px}
  .q{font-family:"Google Sans",sans-serif;font-size:clamp(20px,2.6vw,28px);line-height:1.45;font-weight:500;margin:0 0 18px}
  .mapbox{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1304/1252;width:min(100cqw,calc(100cqh * 1.0415));box-shadow:0 0 0 1px var(--border)}
  .mapbox img{display:block;width:100%;height:100%}
  .pin{position:absolute;transform:translate(-50%,-50%);width:clamp(26px,3.2vw,38px);height:clamp(26px,3.2vw,38px);border-radius:50%;background:#1a73e8;color:#fff;font:700 clamp(13px,1.5vw,18px) "Google Sans",sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:background .4s var(--ease)}
  .pin.hl{background:#d93025;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.18)}}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{all:unset;cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;padding:14px 16px;background:transparent;transition:background .35s var(--ease),border-color .35s var(--ease),opacity .35s var(--ease),transform .2s var(--ease)}
  .opt:hover:not(.locked){background:var(--surface2)}
  .opt:active:not(.locked){transform:scale(.985)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row{display:flex;align-items:center;gap:14px}
  .letter{flex:none;min-width:22px;font:500 16px "Google Sans",sans-serif;color:var(--muted)}
  .otext{font-size:clamp(15px,1.4vw,18px);line-height:1.4}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.correct .letter{color:var(--good)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .letter{color:var(--bad)}
  .opt.dim{opacity:.55}
  /* smooth expanding panels (grid 0fr -> 1fr) */
  .grow{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s var(--ease),opacity .35s var(--ease)}
  .grow>div{overflow:hidden;min-height:0}
  .grow.open{grid-template-rows:1fr;opacity:1}
  .why{padding:10px 0 0 36px;font-size:14px;line-height:1.5;color:var(--text)}
  .why b{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .opt.correct .why b{color:var(--good)} .opt.wrong .why b{color:var(--bad)}
  .hintarea{transition:opacity .3s var(--ease)}
  .hintarea.gone{opacity:0;pointer-events:none}
  .hintbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:14px;font-weight:500;margin-top:16px;padding:6px 10px;border-radius:99px;transition:background .2s var(--ease)}
  .hintbtn:hover{background:var(--surface2)}
  .hintbtn .car{display:inline-block;transition:transform .35s var(--ease)}
  .hintbtn.on .car{transform:rotate(180deg)}
  .hint{margin-top:8px;padding:12px 16px;border-radius:14px;background:var(--surface2);font-size:14px;line-height:1.5;color:var(--muted)}
  /* question slide transitions */
  .qbody{animation:none}
  .qbody.in-r{animation:inR .45s var(--ease) both}
  .qbody.in-l{animation:inL .45s var(--ease) both}
  .qbody.out-l{animation:outL .22s var(--ease-in) both}
  .qbody.out-r{animation:outR .22s var(--ease-in) both}
  @keyframes inR{from{opacity:0;transform:translateX(40px)}}
  @keyframes inL{from{opacity:0;transform:translateX(-40px)}}
  @keyframes outL{to{opacity:0;transform:translateX(-40px)}}
  @keyframes outR{to{opacity:0;transform:translateX(40px)}}
  .opts .opt{animation:rise .5s var(--ease) both}
  .qbody.static .opt{animation:none}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  /* score chips */
  .left{display:flex;align-items:center;gap:10px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font:500 14px "Google Sans",sans-serif;transition:transform .3s var(--ease)}
  .chip.good{color:var(--good);background:var(--good-bg)}
  .chip.bad{color:var(--bad);background:var(--bad-bg)}
  .chip.bump{animation:bump .5s var(--ease)}
  @keyframes bump{40%{transform:scale(1.25)}}
  .fadein{animation:fadeUp .5s var(--ease) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}}
  .rv{animation:rise .5s var(--ease) both}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex:none}
  .btn{all:unset;cursor:pointer;font:500 15px "Google Sans",sans-serif;padding:10px 22px;border-radius:99px;transition:opacity .3s var(--ease),background .3s var(--ease),transform .15s var(--ease)}
  .btn:active:not(:disabled){transform:scale(.96)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{color:var(--accent);border:1px solid var(--border)}
  .btn:disabled,.btn[disabled]{opacity:.35;cursor:default}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .result{text-align:center;padding:12px 0}
  .ring{width:150px;height:150px;margin:6px auto 18px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Google Sans",sans-serif}
  .ring .num b{font-size:34px;font-weight:500}
  .ring .num>span{font-size:13px;color:var(--muted)}
  .result h2{font-family:"Google Sans",sans-serif;font-weight:500;margin:0 0 6px}
  .result p{color:var(--muted);margin:0 0 22px}
  .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .review{margin-top:26px;text-align:left;display:flex;flex-direction:column;gap:10px}
  .rv{border:1px solid var(--border);border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.5}
  .rv .rq{font-weight:500;margin-bottom:4px}
  .rv .ok{color:var(--good)} .rv .no{color:var(--bad)}
  .blooket{display:inline-flex;align-items:center;gap:8px;margin-top:18px;color:var(--accent);text-decoration:none;font-weight:500;font-size:14px}
  .blooket:hover{text-decoration:underline}
  .bfav{width:18px;height:18px;border-radius:4px;display:block}
  .tier{display:inline-flex;align-items:center;gap:8px;flex:none;font:500 13px "Google Sans",sans-serif;color:var(--tc);padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--tc) 13%,transparent);white-space:nowrap}
  .tier.up{animation:lvl 1.2s var(--ease) .6s both}
  @keyframes lvl{0%{transform:scale(.6);opacity:0}45%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .pips{display:inline-flex;gap:3px}
  .pips i{width:14px;height:5px;border-radius:3px;background:var(--border);display:block}
  .chip.lvl{color:#8ab4f8;background:rgba(138,180,248,.13)}
  .rsplit{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:-8px 0 22px}
  .mastery{max-width:560px;margin:0 auto 24px;text-align:left}
  .mhead{display:flex;justify-content:space-between;font:500 14px "Google Sans",sans-serif;margin-bottom:8px}
  .mhead span:last-child{color:var(--muted);font-weight:400}
  .mbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}
  .mbar .seg{width:0;transition:width 1.1s var(--ease)}
  .mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
  .mlegend span{display:inline-flex;align-items:center;gap:6px}
  .mlegend i{width:10px;height:10px;border-radius:3px;display:block}
  .mlegend b{color:var(--text);font-weight:500}
  .rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .rv.rok{border-left:3px solid var(--good)} .rv.rno{border-left:3px solid var(--bad)}
  .reset{all:unset;cursor:pointer;margin-top:22px;font-size:13px;color:var(--muted);padding:6px 12px;border-radius:99px;transition:background .2s var(--ease),color .2s}
  .reset:hover{background:var(--surface2);color:var(--bad)}
  @media (max-width:520px){.rtop{flex-direction:column;gap:6px}}
  @media (max-width:760px){body{padding:8px}.card{padding:18px}.qbody.withmap{display:flex;justify-content:flex-start}.mapcol,.side{flex:none}.mapcol{height:auto;container-type:normal;margin-bottom:16px}.mapbox{width:100%}.why{margin-left:0}}
</style>
</head>

let order, answers, idx, opts;
const $card = document.getElementById("card");

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let navTimer = null, target = null, shown = {good:-1,bad:-1};

function shell(){
  $card.innerHTML = `
    <div class="topline"><div class="left"><span id="count"></span>
      <span class="chip good">✓ <b id="ng">0</b> correct</span>
      <span class="chip bad">✕ <b id="nb">0</b> incorrect</span></div><span id="qtier"></span></div>
    <div id="stage" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    <div class="nav">
      <button class="btn ghost" id="prev">Previous</button>
      <button class="btn primary" id="next">Next</button>
    </div>`;
  $card.classList.remove("fadein"); void $card.offsetWidth; $card.classList.add("fadein");
  document.getElementById("prev").onclick=()=>go(-1);
  document.getElementById("next").onclick=()=>{
    const cur = target ?? idx;
    if(answers[order[cur]]===null) return;
    if(cur<order.length-1) go(1); else go("end");
  };
  shown={good:-1,bad:-1};
}

function start(){
  order = QUIZ.map((_,i)=>i);
  opts = QUIZ.map(q=>shuffle([q.a,...q.wrong]));
  answers = Array(QUIZ.length).fill(null);
  idx = 0; clearTimeout(navTimer); navTimer=null; target=null; shell(); render("r");
}

function tally(){
  let g=0,b=0; order.forEach(i=>{ if(answers[i]!==null){ answers[i]===QUIZ[i].a?g++:b++ } });
  return {g,b};
}

  [["ng",g,"good"],["nb",b,"bad"]].forEach(([id,v,k])=>{
    const el=document.getElementById(id);
    if(shown[k]!==-1 && v>shown[k]){const c=el.parentElement;c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
    el.textContent=v; shown[k]=v;
  });
  const prev=document.getElementById("prev"), next=document.getElementById("next");
  prev.disabled = idx===0;
  next.disabled = answers[order[idx]]===null;
  next.textContent = idx===order.length-1 ? "See results" : "Next";
}

// Navigation never swallows clicks: rapid Previous/Next presses are combined
// into one target and the screen jumps there once the slide-out finishes.
function go(d){
  const base = target ?? idx;
  let n;
  if(d==="end") n="end";
  else { n=base+d; if(n<0||n>=order.length) return; }
  const firstPress = navTimer===null;
  target = n;
  if(firstPress){
    const qb=document.querySelector("#stage .qbody");
    if(qb){ qb.classList.remove("in-l","in-r","static"); void qb.offsetWidth; qb.classList.add(n==="end"||n>idx?"out-l":"out-r"); }
  } else clearTimeout(navTimer);
  // keep the counter/buttons in sync with where we're heading
  if(n!=="end"){
    document.getElementById("count").textContent = `${n+1} / ${order.length}`;
    document.getElementById("prev").disabled = n===0;
  }
  navTimer = setTimeout(()=>{
    navTimer=null; const t=target; target=null;
    if(t==="end"){ results(); return; }
    const dir = t>idx ? "r" : "l"; idx=t; render(dir);
  }, firstPress?210:120);
}

function mapHTML(active){
  return `<div class="mapbox"><img src="${MAP}" alt="Outline map of Latin America with lettered points">${
    Object.entries(PINS).map(([k,[x,y]])=>`<div class="pin${k===active?' hl':''}" style="left:${x}%;top:${y}%">${k}</div>`).join("")
  }</div>`;
}

function optClass(o,Q,chosen){
  if(chosen===null) return "opt";
  if(o===Q.a) return "opt locked correct";
  if(o===chosen) return "opt locked wrong";
  return "opt locked dim";
}
function whyHTML(o,Q,chosen){
  if(chosen===null) return "";
  if(o===Q.a) return `<b>✓ Right answer</b>${Q.ex}`;
  if(o===chosen) return `<b>✕ Not quite</b>The correct answer is ${Q.a}.`;
  return "";
}

function render(dir){
  const qi = order[idx], Q = QUIZ[qi], chosen = answers[qi], done = chosen!==null;
  document.getElementById("stage").innerHTML = `
    <div class="qbody${Q.map?' withmap':''} in-${dir}">
    ${Q.map?`<div class="mapcol">${mapHTML(Q.map)}</div><div class="side">`:""}
    <p class="q">${Q.q}</p>
    <div class="opts">${opts[qi].map((o,i)=>{
      const w=whyHTML(o,Q,chosen);
      return `<button class="${optClass(o,Q,chosen)}" style="animation-delay:${80+i*55}ms" data-o="${encodeURIComponent(o)}" ${done?'tabindex="-1"':''}>
        <div class="row"><span class="letter">${LETTERS[i]}.</span><span class="otext">${o}</span></div>
        <div class="grow${w?' open':''}"><div><div class="why">${w}</div></div></div></button>`;
    }).join("")}</div>
    ${done?"":`<div class="hintarea"><button class="hintbtn" id="hb">Hint <span class="car">▾</span></button>
      <div class="grow" id="hint"><div><div class="hint">${Q.hint}</div></div></div></div>`}
    ${Q.map?"</div>":""}</div>`;
  const qb=document.querySelector("#stage .qbody");
  qb.addEventListener("animationend",e=>{if(e.target===qb) qb.classList.add("static")},{once:false});
  document.querySelectorAll("#stage .opt").forEach(b=>b.onclick=()=>choose(b));
  const hb=document.getElementById("hb");
  if(hb) hb.onclick=()=>{hb.classList.toggle("on");document.getElementById("hint").classList.toggle("open")};
  updateTop();
}

function choose(btn){
  const qi=order[idx], Q=QUIZ[qi];
  if(answers[qi]!==null||navTimer!==null) return;
  const chosen=decodeURIComponent(btn.dataset.o);
  answers[qi]=chosen;
  document.querySelectorAll("#stage .opt").forEach(b=>{
    const o=decodeURIComponent(b.dataset.o), w=whyHTML(o,Q,chosen);
    b.style.animation="none";
    b.className=optClass(o,Q,chosen); b.tabIndex=-1;
    if(w){ b.querySelector(".why").innerHTML=w; requestAnimationFrame(()=>b.querySelector(".grow").classList.add("open")); }
  });
  const ha=document.querySelector("#stage .hintarea");
  if(ha){ ha.classList.add("gone"); ha.querySelector(".grow").classList.remove("open"); }
  updateTop();
}

/* ---------- mastery tiers ---------- */
const TIERS=["Not started","Decent","Good","Proficient","Mastered"];
const TCOL=["var(--muted)","#f6ad55","#fdd663","#8ab4f8","#6dd58c"];
const KEY="unit3-review-mastery";
let mastery={};
try{mastery=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){mastery={}}
const lvl=i=>mastery[QUIZ[i].q]||0;
function saveM(){try{localStorage.setItem(KEY,JSON.stringify(mastery))}catch(e){}}
function pips(l){return `<span class="pips">${[1,2,3,4].map(k=>`<i class="${k<=l?'on':''}" style="${k<=l?`background:${TCOL[l]}`:''}"></i>`).join("")}</span>`}
function tierBadge(l,up){return `<span class="tier${up?' up':''}" style="--tc:${TCOL[l]}">${up?'↑ ':''}${TIERS[l]} ${pips(l)}</span>`}

function score(){return order.reduce((s,i)=>s+(answers[i]===QUIZ[i].a?1:0),0)}

function results(){
  const s=score(), n=order.length, pct=Math.round(s/n*100), C=2*Math.PI*64;
  // level up every question answered correctly this round
  const before={}, ups=[];
  order.forEach(i=>{const l=lvl(i); before[i]=l; if(answers[i]===QUIZ[i].a && l<4){mastery[QUIZ[i].q]=l+1; ups.push(i)}});
  saveM();
  const counts=[0,0,0,0,0]; QUIZ.forEach((_,i)=>counts[lvl(i)]++);
  const total=QUIZ.length, mastered=counts[4];
  const msg = pct===100?"Perfect round! Every question moved up a tier.":pct>=80?"Great job! Review the few you missed and go again.":pct>=60?"Good effort — check what you missed below and try again.":"Keep going — every correct answer levels a question up.";
  $card.innerHTML=`<div class="resultwrap fadein"><div class="result">
    <div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="64" stroke="var(--surface2)" stroke-width="12" fill="none"/>
      <circle cx="75" cy="75" r="64" stroke="url(#rg)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" id="arc"/>
      <defs><linearGradient id="rg"><stop offset="0" stop-color="#4285f4"/><stop offset=".5" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs></svg>
      <div class="num"><b><span id="cu">0</span>/${n}</b><span id="pc">0%</span></div></div>
    <h2>${pct>=80?"Nice work!":"Round complete"}</h2><p>${msg}</p>
    <div class="rsplit"><span class="chip good">✓ ${s} correct</span><span class="chip bad">✕ ${n-s} incorrect</span>${ups.length?`<span class="chip lvl">↑ ${ups.length} leveled up</span>`:""}</div>

    <div class="mastery">
      <div class="mhead"><span>Mastery</span><span>${mastered} / ${total} mastered</span></div>
      <div class="mbar">${[4,3,2,1,0].map(l=>counts[l]?`<div class="seg" data-w="${counts[l]/total*100}" style="background:${l?TCOL[l]:'var(--surface2)'}"></div>`:"").join("")}</div>
      <div class="mlegend">${[1,2,3,4].map(l=>`<span><i style="background:${TCOL[l]}"></i>${TIERS[l]} <b>${counts[l]}</b></span>`).join("")}<span><i style="background:var(--surface2)"></i>Not started <b>${counts[0]}</b></span></div>
    </div>

    <div class="btns"><button class="btn primary" id="retake">Try again</button><button class="btn ghost" id="missed">Retry missed (${n-s})</button></div>
    <a class="blooket" href="https://dashboard.blooket.com/set/690213095de06d3324e78b4a" target="_blank" rel="noopener"><img class="bfav" src="https://www.google.com/s2/favicons?domain=blooket.com&sz=64" alt="" width="18" height="18" onerror="this.remove()">Play the Blooket review →</a>

    <div class="review">${order.map((i,k)=>{const q=QUIZ[i], ok=answers[i]===q.a, up=ups.includes(i);
      return `<div class="rv ${ok?'rok':'rno'}" style="animation-delay:${300+k*40}ms">
        <div class="rtop"><div class="rq">${i+1}. ${q.q}</div>${tierBadge(lvl(i),up)}</div>${
      ok?`<span class="ok">✓ ${q.a}</span>`:`<span class="no">✕ You chose: ${answers[i]}</span><br><span class="ok">✓ Correct: ${q.a}</span>`}</div>`}).join("")}</div>
    <button class="reset" id="reset">Reset mastery progress</button>
  </div></div>`;
  requestAnimationFrame(()=>setTimeout(()=>{
    const a=document.getElementById("arc");a.style.transition="stroke-dashoffset 1.2s cubic-bezier(.2,0,0,1)";a.style.strokeDashoffset=C*(1-s/n);
    document.querySelectorAll(".mbar .seg").forEach(sg=>sg.style.width=sg.dataset.w+"%");
  },80));
  const t0=performance.now(), cu=document.getElementById("cu"), pc=document.getElementById("pc");
  (function tick(t){const k=Math.min(1,(t-t0)/1200), e=1-Math.pow(1-k,3);cu.textContent=Math.round(s*e);pc.textContent=Math.round(pct*e)+"%";if(k<1)requestAnimationFrame(tick)})(t0);
  document.getElementById("retake").onclick=start;
  const m=document.getElementById("missed");
  if(s===n) m.disabled=true;
  m.onclick=()=>{const miss=order.filter(i=>answers[i]!==QUIZ[i].a); if(!miss.length)return;
    miss.forEach(i=>{answers[i]=null;opts[i]=shuffle(opts[i])}); order=miss; idx=0; navTimer=null; target=null;
    shell(); render("r");};
  document.getElementById("reset").onclick=e=>{
    if(e.target.dataset.sure){mastery={};saveM();start();return}
    e.target.dataset.sure=1; e.target.textContent="Tap again to confirm reset";};
}

start();
</script>
</body>
